<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for UFC Course</title>
</head>

<body>
    <div style="text-align: center;">
        <h1>UFC Fighting Academy</h1>
        <p>Training | MMA Techniques | Fitness Guide</p>
        <p>Register for our upcoming MMA training course and take your skills to the next level!</p>
        <hr>
        <h3>Registration Form</h3>
        <form method="POST" action="#">
            <table>
                <tr>
                    <td><label for="reg-name">Name:</label></td>
                    <td><input type="text" id="reg-name" name="name"></td>
                </tr>
                <tr>
                    <td><label for="reg-age">Age:</label></td>
                    <td><input type="number" id="reg-age" name="age"></td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td><label for="reg-email">Email:</label></td>
                    <td><input type="email" id="reg-email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="reg-course">Select a course:</label></td>
                    <td>
                        <select id="reg-course" name="course">
                            <option value="basic">Basic MMA Training</option>
                            <option value="intermediate">Intermediate MMA Training</option>
                            <option value="advanced">Advanced MMA Training</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="reg-photo">Upload a photo:</label></td>
                    <td><input type="file" id="reg-photo" name="photo"></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Submit"></td>
                    <td><input type="reset" value="Reset"></td>
                </tr>
            </table>
        </form>
        <hr>
        <a href="UFC_webpage.html">Back to UFC Home</a>
    </div>
</body>

</html>
