<!DOCTYPE html>
<html>
    <Head>
        <title>Register for UFC Course</title>
    </Head>
    <body>
        <div>
            <center>
                <h1>UFC Fighting Academy</h1>
                <p>Training | MMA Techniques | Fitness Guide</p>
                <p>Register for our upcoming MMA training course and take your skills to the next level!</p>
                <hr>
                <h3>Registration Form</h3>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" name="name"></td>
                    </tr>
                    <tr>
                        <td>Age:</td>
                        <td><input type="number" name="age"></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" name="gender" value="male"> Male
                            <input type="radio" name="gender" value="female"> Female
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="email" name="email"></td>
                    </tr>
                    <tr>
                        <td>Select a course:</td>
                        <td>
                            <select name="course">
                                <option value="basic">Basic MMA Training</option>
                                <option value="intermediate">Intermediate MMA Training</option>
                                <option value="advanced">Advanced MMA Training</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Upload a photo:</td>
                        <td><input type="file" name="photo"></td>
                    </tr>
                    <tr>
                        <td><input type="submit" value="Submit"></td>
                        <td><input type="reset" value="Reset"></td>
                    </tr>
                </table>
                <hr>
                <a href="Sample_ufc.html">Back to UFC Home</a>
            </center>
        </div>
    </body>
</html>
